<style>
/* maracatu page v2 */
.hero-wrap .hero img{width:100%!important;height:auto!important;aspect-ratio:16/9;object-fit:cover!important;object-position:50% 60%!important;padding:0!important}
.mc-sec{margin-top:clamp(72px,9vw,128px)}
.mc-lead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:clamp(20px,4vw,64px);align-items:end;margin-bottom:clamp(24px,3vw,40px)}
.mc-lead h2{margin:8px 0 0;font-family:var(--display);font-weight:900;font-stretch:125%;font-variation-settings:"wdth" 125;font-size:clamp(28px,3.6vw,46px);line-height:1;text-transform:uppercase}
.mc-lead p{margin:0;color:var(--mute);font-size:16px;line-height:1.6;max-width:56ch;text-wrap:pretty}
.mc-k{font-size:11px;letter-spacing:.12em;color:var(--c)}
.mc-vid{margin:0;border-radius:18px;overflow:hidden;background:var(--panel)}
.mc-vid video{display:block;width:100%;height:auto}
.mc-cap{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:var(--mute);letter-spacing:.08em}
.mc-seq{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.2vw,14px)}
.mc-seq figure,.mc-g3 figure,.mc-duo figure{margin:0}
.mc-duo{display:grid;grid-template-columns:3fr 4fr;gap:clamp(10px,1.4vw,16px)}
.mc-duo .zoom{all:unset;display:block;cursor:zoom-in;border-radius:18px;overflow:hidden}
.mc-duo img{display:block;width:100%;height:auto;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.mc-duo .zoom:hover img{transform:scale(1.02)}
.mc-seq .zoom,.mc-g3 .zoom{all:unset;display:block;cursor:zoom-in;border-radius:10px;overflow:hidden;background:var(--panel)}
.mc-seq img,.mc-g3 img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.mc-seq .zoom:hover img,.mc-g3 .zoom:hover img{transform:scale(1.03)}
.mc-seq figcaption{margin-top:8px;font-size:11px;color:var(--mute);letter-spacing:.08em;min-height:1.2em}
.mc-seq figure:nth-child(2n) figcaption{visibility:hidden}
.mc-ar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:center}
.mc-ar .mc-lead{display:block;margin:0}
.mc-ar .mc-lead p{margin-top:16px}
.mc-steps{border-top:1px solid var(--line)}
.mc-step{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1.9fr);gap:clamp(16px,3vw,40px);padding:clamp(28px,3.5vw,44px) 0;border-bottom:1px solid var(--line);align-items:start}
.mc-n{font-size:12px;color:var(--c);padding-top:6px}
.mc-st h3{margin:0 0 10px;font-family:var(--display);font-weight:800;font-stretch:115%;font-variation-settings:"wdth" 115;font-size:clamp(18px,1.8vw,24px);line-height:1.1;text-transform:uppercase}
.mc-st p{margin:0;color:var(--mute);font-size:15px;line-height:1.6;text-wrap:pretty}
.mc-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mc-g3 figcaption{margin-top:8px;font-size:11px;color:var(--mute);letter-spacing:.08em}
.mc-fb{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.mc-fb h4{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:500}
.mc-fb ul{margin:0;padding-left:16px;color:var(--mute);font-size:15px;line-height:1.6}
@media (max-width:860px){.mc-duo{grid-template-columns:1fr}.mc-duo+.mc-cap{display:none}.mc-lead,.mc-ar{grid-template-columns:1fr}.mc-step{grid-template-columns:40px minmax(0,1fr)}.mc-step .mc-g3,.mc-step .mc-fb{grid-column:1/-1}.mc-seq{grid-template-columns:repeat(2,minmax(0,1fr))}.mc-fb{grid-template-columns:1fr}}
.nav .lang{all:unset;cursor:pointer;font-size:12px;letter-spacing:.06em;padding:6px 11px;border:1px solid var(--line);border-radius:999px;color:var(--paper);transition:border-color .2s,color .2s}
.nav .lang:hover,.nav .lang:focus-visible{border-color:var(--c);color:var(--c)}
</style>
