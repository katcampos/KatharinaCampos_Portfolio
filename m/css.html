<style>
/* maracatu page */
.mc-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mc-pairs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mc-pairs figure,.mc-g2 figure{margin:0}
.mc-pairs .zoom{all:unset;display:block;cursor:zoom-in;border-radius:10px;overflow:hidden}
.mc-pairs img{display:block;width:100%;height:auto;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.mc-pairs .zoom:hover img{transform:scale(1.03)}
.mc-pairs figcaption{margin-top:8px;font-size:11px;color:var(--mute);letter-spacing:.06em}
.mc-seq figure:nth-child(4n+2) figcaption,.mc-seq figure:nth-child(4n) figcaption{visibility:hidden}
.mc-ends{max-width:760px;margin:16px auto 0}
.mc-ar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center}
.mc-ar figure{margin:0}
.mc-ar video{display:block;width:100%;height:auto;border-radius:18px}
.mc-ar figcaption{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.lp-grid.g4 img{aspect-ratio:1/1;object-fit:cover}
.lp-grid .zoom{background:var(--panel)!important}
.lp-grid.pt img{aspect-ratio:3/4;object-fit:cover}

.mc-notes .zoom{all:unset;display:block;cursor:zoom-in;border-radius:14px;overflow:hidden}
.mc-notes img{display:block;width:100%;height:auto}
.mc-notes figure:not(:first-child) .zoom{border-radius:6px;transform:rotate(-1.5deg)}

.mc-fb{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,48px);margin:0 0 22px;max-width:760px}
